name: Go tools regression

on:
  push:
    branches: [ci/go-tools-regression]
  pull_request:
    paths:
      - 'pentagi_upstream/backend/**'
      - '.github/workflows/go-tools.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: pentagi_upstream/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pentagi_upstream/backend/go.mod
          cache-dependency-path: pentagi_upstream/backend/go.sum
      - name: Test tools and TrustGate
        run: go test -count=1 -json ./pkg/tools ./pkg/trustgate | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Summarize runtime results
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/go-tests.jsonl" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          log = pathlib.Path(sys.argv[1])
          if not log.exists():
              print("Go tests did not start.")
              sys.exit(0)
          totals = collections.defaultdict(collections.Counter)
          for line in log.read_text().splitlines():
              entry = json.loads(line)
              action, test = entry["Action"], entry.get("Test")
              if not test or "/" in test or action not in {"pass", "fail", "skip"}:
                  continue
              package = entry["Package"]
              totals[package][action] += 1
              if action in {"fail", "skip"}:
                  print(f"{package} {action}: {test}")
          for package, counts in sorted(totals.items()):
              print(f"{package}: {counts['pass']} passed, {counts['fail']} failed, {counts['skip']} skipped (top-level)")
          PY
