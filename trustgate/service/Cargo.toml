[package]
name = "trustgate-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
cedar-policy = "4.14.0"
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio-test = "0.4.6"
